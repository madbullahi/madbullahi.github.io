* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink); font-family: "Manrope", ui-sans-serif, system-ui, sans-serif; font-size: 1rem; line-height: 1.5rem; padding: 48px 16px; }

p { margin: 0; color: var(--muted); font-size: 1.125rem; line-height: 1.75rem; text-wrap: pretty; }
.row { display: flex; flex-wrap: wrap; gap: 12px; }

a:hover { transform: translateY(-2px); }
a:active { transform: scale(0.98); }
