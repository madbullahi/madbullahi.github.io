<script>

  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  const italSp = (s) => esc(s).replace(/\b(Daphnia magna|Daphnia|Aspergillus)\b/g, '<i>$1</i>');
  const me = (s) => esc(s).replace(/Abdullahi, M\./g, '<strong>Abdullahi, M.</strong>');
  const safeUrl = (u) => /^https?:\/\//i.test(u || '') ? u : '';
  const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const fmtDate = (d) => { const m = /^(\d{4})-(\d{2})(?:-(\d{2}))?$/.exec(d || ''); if (!m) return esc(d); return (m[3] ? (+m[3]) + ' ' : '') + MONTHS[+m[2] - 1] + ' ' + m[1]; };

  const PLURAL = { Experiment: 'Experiments', SOP: 'SOPs', Result: 'Results', Milestone: 'Milestones', Fieldwork: 'Fieldwork', Note: 'Notes' };

  /* ---------- static sections ---------- */

  $('about-text').innerHTML = D.about.map(p => `<p>${rich(p)}</p>`).join('');
  $('now').innerHTML = `<span class="tag">${esc(D.now.tag)}</span><h3>${esc(D.now.title)}</h3><p>${italSp(D.now.text)}</p><a class="btn small" href="#humboldt">Follow the project log</a>`;

  $('timeline').innerHTML = D.experience.map(e => `<li><span class="when">${esc(e.when)}</span><div><h3>${esc(e.title)}</h3><p class="org">${esc(e.org)}</p>${e.points?.length ? `<ul>${e.points.map(p => `<li>${italSp(p)}</li>`).join('')}</ul>` : ''}</div></li>`).join('');

  const pubs = [...D.publications].sort((a, b) => (b.year ?? 9999) - (a.year ?? 9999));
  $('pubs').innerHTML = pubs.map(p => {
    const venue = p.venue ? `<p class="v"><i>${esc(p.venue)}</i>${p.details ? ', ' + esc(p.details) : ''}${p.doi ? ` · <a class="doi" href="https://doi.org/${esc(p.doi)}" target="_blank" rel="noopener">doi:${esc(p.doi)}</a>` : ''}</p>` : '';
    const st = p.status ? `<span class="status">${esc(p.status)}</span>` : '';
    return `<li class="pub"><span class="yr">${p.year ?? '—'}</span><div><p class="t">${italSp(p.title)}${st}</p><p class="a">${me(p.authors)}</p>${venue}</div></li>`;
  }).join('');
  $('chapters').innerHTML = D.chapters.map(c => `<li class="pub"><span class="yr">${c.year ?? '—'}</span><div><p class="t">${italSp(c.title)}${c.status ? `<span class="status">${esc(c.status)}</span>` : ''}</p><p class="a">${me(c.authors)}</p>${c.venue ? `<p class="v"><i>${esc(c.venue)}</i></p>` : ''}</div></li>`).join('');
  $('early').innerHTML = italSp(D.earlyWork);

  const rows = (list) => list.map(r => { const u = safeUrl(r.url); return `<li><span class="when">${esc(r.when)}</span><div><h3>${u ? `<a href="${esc(u)}" target="_blank" rel="noopener">${italSp(r.title)}</a>` : italSp(r.title)}</h3><p>${italSp(r.text)}</p></div></li>`; }).join('');
  $('awards').innerHTML = rows(D.awards);
  $('media').innerHTML = rows(D.media);
  $('talks').innerHTML = rows(D.talks);
  $('edu').innerHTML = rows(D.education);
  $('skills').innerHTML = D.skills.map(s => `<li>${esc(s)}</li>`).join('');

  $('email').textContent = D.email;
  $('link-row').insertAdjacentHTML('beforeend', D.links.map(l => `<a href="${esc(safeUrl(l.url))}" target="_blank" rel="noopener">${esc(l.label)}</a>`).join(''));
  $('copy-email').addEventListener('click', (ev) => {
    const btn = ev.currentTarget;
    const reset = () => setTimeout(() => { btn.textContent = 'Copy'; }, 1600);
    const fallback = () => { const r = document.createRange(); r.selectNodeContents($('email')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); btn.textContent = 'Selected'; reset(); };
    try { navigator.clipboard.writeText(D.email).then(() => { btn.textContent = 'Copied'; reset(); }, fallback); } catch (e) { fallback(); }
  });
  $('yr').textContent = new Date().getFullYear();
  $('updated').textContent = 'Last updated ' + fmtDate(D.updated);

  /* ---------- Humboldt project log ---------- */
  const P = D.project || {};
  $('proj-title').innerHTML = italSp(P.title || 'Humboldt project');
  $('proj-intro').innerHTML = (P.intro || []).map(p => `<p>${italSp(p)}</p>`).join('');

  if (P.page && safeUrl(P.page.url)) $('proj-page').innerHTML = `<a class="btn small" href="${esc(P.page.url)}" target="_blank" rel="noopener">${esc(P.page.label || 'Project page')} ↗</a>`;

  let filter = 'All', showAll = false, canWrite = false, assets = null, artifact = null, confirmId = null;
  const SHOW = 6;
  const sorted = () => [...D.log].sort((a, b) => String(b.date).localeCompare(String(a.date)));

  function renderChips() {
    const present = TYPES.filter(t => D.log.some(e => e.type === t));
    const list = ['All', ...present];
    if (!list.includes(filter)) filter = 'All';
    $('chips').innerHTML = present.length > 1 ? list.map(t => `<button class="chip" type="button" data-t="${esc(t)}" aria-pressed="${t === filter}">${esc(t === 'All' ? 'All' : PLURAL[t])}</button>`).join('') : '';
  }
  function renderLog() {
    renderChips();
    const items = sorted().filter(e => filter === 'All' || e.type === filter);
    const shown = showAll ? items : items.slice(0, SHOW);
    if (!items.length) {
      $('log').innerHTML = `<li class="empty">${canWrite ? 'No updates yet. Use “Post an update” to add your first experiment, SOP or result.' : 'Updates from the project will appear here.'}</li>`;
    } else {
      $('log').innerHTML = shown.map(e => {
        const link = safeUrl(e.link);
        const file = e.file && /^[0-9a-f]{32}$/.test(e.file.id || '') ? e.file : null;
        const paras = String(e.text || '').split(/\n\s*\n/).filter(Boolean).map(p => `<p>${italSp(p).replace(/\n/g, '<br>')}</p>`).join('');
        const links = (link || file) ? `<div class="links">${link ? `<a href="${esc(link)}" target="_blank" rel="noopener">${esc(e.linkLabel || 'Read more')}</a>` : ''}${file ? `<a class="file" href="https://claude.ai/artifact/4TKo2VvsTrtr93AnAwqn49#humboldt" target="_blank" rel="noopener">${esc(file.name || 'Attachment')}</a>` : ''}</div>` : '';
        const own = canWrite ? (confirmId === e.id
          ? `<div class="own"><span class="confirm">Delete this update from the site?</span><button class="btn small danger" type="button" data-act="del-yes" data-id="${esc(e.id)}">Delete</button><button class="btn small" type="button" data-act="del-no">Cancel</button></div>`
          : `<div class="own"><button class="btn small" type="button" data-act="edit" data-id="${esc(e.id)}">Edit</button><button class="btn small" type="button" data-act="del" data-id="${esc(e.id)}">Delete</button></div>`) : '';
        return `<li class="entry"><span class="when">${fmtDate(e.date)}</span><div class="body"><span class="kind" data-k="${esc(e.type)}">${esc(e.type)}</span><h3>${italSp(e.title)}</h3>${paras}${links}${own}</div></li>`;
      }).join('');
    }
    const extra = items.length - SHOW;
    $('btn-more').hidden = extra <= 0;
    $('btn-more').textContent = showAll ? 'Show fewer' : `Show all ${items.length} updates`;
  }
  $('chips').addEventListener('click', (ev) => { const b = ev.target.closest('.chip'); if (!b) return; filter = b.dataset.t; showAll = false; renderLog(); });
  $('btn-more').addEventListener('click', () => { showAll = !showAll; renderLog(); });
  renderLog();

  /* ---------- hero: a Daphnia filtering particles out of the water ---------- */
  const cv = $('tank');
  const ctx = cv.getContext('2d');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W = 0, H = 0, parts = [];
  const t0 = performance.now();
  const css = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  function size() {
    const r = cv.getBoundingClientRect();
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    W = r.width; H = r.height;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (!parts.length) for (let i = 0; i < 70; i++) parts.push(spawn(true));
  }
  function spawn(anywhere) {
    return { x: anywhere ? Math.random() * W : -10, y: Math.random() * H, r: 1 + Math.random() * 2.2, v: .15 + Math.random() * .35, ph: Math.random() * 6.28, a: 1, eaten: false };
  }
  function daphnia(cx, cy, s, t) {
    const ink = css('--accent'), amber = css('--amber'), fg = css('--ink');
    ctx.save(); ctx.translate(cx, cy + Math.sin(t / 900) * 6 * s); ctx.rotate(-0.18 + Math.sin(t / 1400) * 0.04);
    ctx.strokeStyle = ink; ctx.lineWidth = 2 * s; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(10 * s, 70 * s); ctx.quadraticCurveTo(30 * s, 110 * s, 52 * s, 132 * s); ctx.stroke();
    ctx.fillStyle = ink + '22'; ctx.lineWidth = 1.6 * s;
    ctx.beginPath(); ctx.ellipse(0, 20 * s, 48 * s, 64 * s, 0.12, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
